name: campuslost
description: Aplikasi Pelaporan & Pencarian Barang Hilang di Lingkungan Kampus
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  smooth_page_indicator: ^1.1.0
  intl: ^0.20.2
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.5.0
  firebase_storage: ^13.4.2
  image_picker: ^1.1.2
  lottie: ^3.1.2
  geolocator: ^13.0.1
  url_launcher: ^6.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
